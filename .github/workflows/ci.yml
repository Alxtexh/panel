# Everything that was previously only run by hand.
#
# WHY THIS IS THE HIGHEST-VALUE FILE IN THE REPOSITORY. The suite, the type
# check, the build and `panel:doctor` have all been green for months - because
# somebody remembered to run them. The failures this project keeps finding are
# the ones nothing checks: a package that shipped no Vue, a page file that
# rendered an empty component, a diagnostic that reported problems that were not
# problems. Each was invisible until a human looked. A check that only runs when
# remembered is a check that is present on the day it is written and absent every
# day after.
#
# THE TWO HALVES RUN AS TWO JOBS, deliberately, so a failure names itself. A
# single job that installs PHP and Node and runs five commands reports "CI
# failed"; two jobs report "the client half failed", which is the difference
# between reading a log and knowing where to look.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first. The interesting answer is
# always about the newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP suite
    runs-on: ubuntu-latest

    # THE DEFAULT CONNECTION IS STILL SQLITE IN MEMORY, and that property is
    # kept on purpose: a laptop offline with no services running gets the same
    # 1,213-test suite it always has, and MysqlRestoreTest / PgvectorRetrievalTest
    # skip exactly as they did before, with a message naming the fixture script.
    #
    # These two services exist ONLY so CI, specifically, does not have to be
    # that laptop. They un-gate the 13 tests roadmap 2.5 named - 5 for a real
    # MariaDB restore, 8 for the native pgvector search path - which is real
    # coverage that has been sitting behind "run this script first" since the
    # day it was written.
    services:
      mariadb:
        image: mariadb:11
        ports:
          - 3399:3306
        env:
          # Matches `MysqlRestoreTest`'s hardcoded root/no-password/port 3399 -
          # that test connects exactly like a real incident restore does, with
          # no fixture-specific config path for CI to diverge onto.
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: panelkit_restore
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=10
      postgres:
        image: pgvector/pgvector:pg16
        ports:
          - 5499:5432
        env:
          # `PgvectorRetrievalTest` reads the port and database from
          # `PANELKIT_PG_PORT` / `PANELKIT_PG_DATABASE`, defaulting to exactly
          # these values - set explicitly here anyway so the mapping is not
          # "the test happens to agree with the service", it is stated once.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: panelkit_rag
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, pdo_mysql, pdo_pgsql, zip, intl, bcmath, gd
          coverage: none

      - name: Install dependencies
        working-directory: apps/playground
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        working-directory: apps/playground
        run: |
          cp .env.example .env
          php artisan key:generate

      # THE IMAGE PROVIDES THE EXTENSION; IT DOES NOT ENABLE IT PER DATABASE.
      # `pgvector/pgvector` ships the `vector` extension files, but a fresh
      # database still needs `CREATE EXTENSION` run against it once -
      # `PgvectorRetrievalTest` checks `pg_extension` for exactly this and
      # skips if it is missing, the same check a real installation's own
      # doctor-style guard would make.
      - name: Enable pgvector
        run: PGPASSWORD= psql -h 127.0.0.1 -p 5499 -U postgres -d panelkit_rag -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Tests
        working-directory: apps/playground
        env:
          PANELKIT_PG_PORT: 5499
          PANELKIT_PG_DATABASE: panelkit_rag
        run: vendor/bin/phpunit

      # Same story as the JS lint step below: Pint had a config and no
      # enforcement, so it drifted to ~70 files needing a fix - mostly
      # `ordered_imports` and `fully_qualified_strict_types`, nothing
      # behavioural. Fixed in the same change that adds this step.
      #
      # `packages/panel` is not covered here. It has no Pint dependency and no
      # config of its own; adding one is a separate decision about that
      # package's own tooling, not a gap in enforcing what already exists.
      - name: Pint
        working-directory: apps/playground
        run: vendor/bin/pint --test

      # Configuration that is silently wrong. It is a command the package ships
      # for its users, so a version of it that fails on its own reference
      # application is worth catching here rather than in an installation.
      - name: panel:doctor
        working-directory: apps/playground
        run: php artisan panel:doctor

  client:
    name: Client half
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # PHP IS HERE FOR ONE COMMAND, AND IT IS NOT OPTIONAL.
      #
      # `resources/js/{routes,actions,wayfinder}` are generated from the route
      # table by Wayfinder and are not committed, so on a fresh checkout every
      # file that imports `@/routes` fails to resolve. The type check reported
      # forty "cannot find module" errors that say nothing about the real cause.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, zip, intl
          coverage: none

      - name: Install PHP dependencies
        working-directory: apps/playground
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate the route helpers
        working-directory: apps/playground
        run: |
          cp .env.example .env
          php artisan key:generate
          # `--with-form` MATCHES `formVariants: true` IN vite.config.ts. Without
          # it the route helpers are generated but their `.form` variants are
          # not, and the type check fails on five components that use them - a
          # smaller and more confusing version of the same failure.
          php artisan wayfinder:generate --with-form

      # THE PACKAGES FIRST, AND NOT ONLY FOR SPEED. Both are linked into the
      # application with `file:`, and both carry their own dependencies - the
      # type checker resolves `vue` from the package's real path, so a package
      # with no `node_modules` fails to type-check every file in it while the
      # application itself looks fine.
      - name: Install @alxtexh-enterprise/panel
        working-directory: packages/ui
        run: npm install --no-audit --no-fund

      - name: Install the application
        working-directory: apps/playground
        run: npm install --no-audit --no-fund

      # THE PACKAGE IS BUILT BEFORE ANYTHING TYPE-CHECKS AGAINST IT.
      #
      # The package's `dist` half ships compiled - it has to, because its shadcn components
      # declare props with types imported from `reka-ui` and a consumer's Vite
      # cannot resolve those across a package boundary. `dist` is generated and
      # therefore gitignored, so `types: ./dist/index.d.ts` points at nothing on
      # a fresh checkout: `vue-tsc` below resolves the package to a missing file
      # and reports errors that name the application's own screens.
      - name: Build @alxtexh-enterprise/panel
        working-directory: packages/ui
        run: npm run build

      # THE COMPOSER PACKAGE SHIPS A MIRROR OF packages/ui. Editing Vue under
      # packages/ui without `make sync-client` leaves resources/client stale
      # while the playground (Vite-aliased to source) still looks fine. Compare
      # package.json + inertia (not dist bytes: Vite is not bit-identical).
      - name: Client mirror sync
        run: make check-client

      - name: Unit tests
        working-directory: packages/ui
        run: npm test

      - name: Types
        working-directory: apps/playground
        run: npx vue-tsc --noEmit

      # THE REFORMAT LANDED IN THE SAME CHANGE THAT ADDS THIS STEP, not before
      # it and not after. Enforcing lint on a repository that has never been
      # clean means either a red build on day one that everybody learns to
      # ignore, or a silent reformat commit with no enforcement behind it that
      # drifts again within a week. `npm run lint:check` and `npm run
      # format:check` are both zero right now, in this same commit, in all
      # three JS/TS surfaces - the application and both packages via the
      # basePath blocks above.
      - name: Lint
        working-directory: apps/playground
        run: npm run lint:check

      - name: Format
        working-directory: apps/playground
        run: npm run format:check

      # THE PACKAGE IS FORMAT-CHECKED SEPARATELY, because it carries its own
      # `.prettierrc` (no semicolons, 100 columns - see the comment on that
      # file) that only applies from within its own directory. The lint pass
      # above already covers packages/ui through the basePath blocks in the
      # playground's eslint config; format is a per-directory tool with no
      # such mechanism.
      - name: Format (packages/ui)
        working-directory: packages/ui
        run: npm run format:check

      # AND LINTED, which it silently was not for three releases.
      #
      # `eslint.config.js` beside the package was written to solve exactly this
      # - ESLint 9 refuses to lint above its config's base path - and then
      # nothing ever ran it: no script, no CI step. The playground's config
      # still carried a `basePath` block naming `packages/inertia`, a directory
      # 0.8.0 deleted, so `eslint .` there resolved it to nothing and exited
      # zero. A lint pass over a directory that is not there looks exactly like
      # a clean one.
      #
      # THE BINARY COMES FROM THE PLAYGROUND on purpose: the config already
      # imports the playground's rules, so one rule set governs both and there
      # is no second dependency tree to keep in step.
      - name: Lint (packages/ui)
        working-directory: packages/ui
        run: npm run lint:check

      # THE BUILD IS NOT REDUNDANT WITH THE TYPE CHECK. A production build
      # resolves every import for real and runs the SFC compiler over every
      # component; the type checker does neither. An import of a file that does
      # not exist type-checks clean and fails here.
      #
      # `build:ssr` RATHER THAN `build`, because it builds both bundles. The
      # server bundle resolves imports through Node rather than the browser
      # field, which is where a duplicated dependency surfaces - the packaged
      # screens once resolved their own copy of `@inertiajs/vue3` and rendered
      # fine in the browser while server rendering died on an internal.
      - name: Build
        working-directory: apps/playground
        run: npm run build:ssr

  # ---------------------------------------------------------------- browser
  #
  # THE ONLY JOB THAT LOADS A PAGE.
  #
  # Two bugs shipped in one afternoon that the other two jobs could not see: a
  # form bound an event the component does not emit - type-checked, built,
  # flipped the radio in the DOM and never told the form - and an invoice
  # rendered three correct figures as one number, because right-aligned cells
  # had no horizontal padding. Both were obvious on a screen and invisible to
  # 1,237 passing tests and a clean type check.
  #
  # A SEPARATE JOB, not a step in the PHP one, because it needs a browser, a
  # built bundle and a running server. Bolting that onto the fast job would
  # make every PHP failure wait for Chrome.
  browser:
    name: Browser tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, zip, intl, bcmath, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PHP dependencies
        working-directory: apps/playground
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        working-directory: apps/playground
        run: |
          cp .env.example .env
          php artisan key:generate

      # Wayfinder writes the route helpers the client imports. They are
      # generated rather than committed, so the build fails without this.
      - name: Generate the route helpers
        working-directory: apps/playground
        run: php artisan wayfinder:generate --with-form

      # THE PACKAGE IS BUILT HERE TOO. Its `dist` is generated, so a fresh
      # checkout has none - and the asset build below resolves the package
      # through `node_modules`, where `main` points at exactly that.
      - name: Install the client half
        run: |
          cd packages/ui && npm install --no-audit --no-fund && npm run build
          cd ../../apps/playground && npm install --no-audit --no-fund

      # CHROME FOR TESTING, at the major version Dusk's ChromeDriver matches.
      # The runner's own Chrome would work today and drift the moment either
      # side updates; pinning the pair is what stops a version mismatch being
      # reported as a browser that will not start.
      - name: Install Chrome
        working-directory: apps/playground
        run: npx --yes @puppeteer/browsers install chrome@151

      - name: Install ChromeDriver
        working-directory: apps/playground
        run: php artisan dusk:chrome-driver --detect

      # The script owns the database, the port and the build. It refuses to run
      # against the development database, which matters less in CI than on a
      # laptop but is the same script either way.
      - name: Browser tests
        run: scripts/dusk.sh

      # THE SCREENSHOTS ARE THE POINT OF UPLOADING ANYTHING. A browser failure
      # in CI is otherwise a selector name and a timeout; the screenshot Dusk
      # takes at the moment of failure is usually the whole diagnosis. The two
      # times this suite failed while being written, the screenshot showed the
      # feature working and the assertion wrong.
      - name: Failure screenshots and console logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-failures
          path: |
            apps/playground/tests/Browser/screenshots
            apps/playground/tests/Browser/console
          retention-days: 7
