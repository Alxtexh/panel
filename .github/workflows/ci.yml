# Everything that was previously only run by hand.
#
# WHY THIS IS THE HIGHEST-VALUE FILE IN THE REPOSITORY. The suite, the type
# check, the build and `panel:doctor` have all been green for months - because
# somebody remembered to run them. The failures this project keeps finding are
# the ones nothing checks: a package that shipped no Vue, a page file that
# rendered an empty component, a diagnostic that reported problems that were not
# problems. Each was invisible until a human looked. A check that only runs when
# remembered is a check that is present on the day it is written and absent every
# day after.
#
# THE TWO HALVES RUN AS TWO JOBS, deliberately, so a failure names itself. A
# single job that installs PHP and Node and runs five commands reports "CI
# failed"; two jobs report "the client half failed", which is the difference
# between reading a log and knowing where to look.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first. The interesting answer is
# always about the newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, zip, intl, bcmath, gd
          coverage: none

      # The suite runs against SQLite in memory with the array cache store, so
      # it needs no services. That is a property worth keeping: the moment it
      # needs Redis to pass, it stops being runnable on a laptop offline.
      - name: Install dependencies
        working-directory: apps/playground
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        working-directory: apps/playground
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests
        working-directory: apps/playground
        run: vendor/bin/phpunit

      # Configuration that is silently wrong. It is a command the package ships
      # for its users, so a version of it that fails on its own reference
      # application is worth catching here rather than in an installation.
      - name: panel:doctor
        working-directory: apps/playground
        run: php artisan panel:doctor

  client:
    name: Client half
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # PHP IS HERE FOR ONE COMMAND, AND IT IS NOT OPTIONAL.
      #
      # `resources/js/{routes,actions,wayfinder}` are generated from the route
      # table by Wayfinder and are not committed, so on a fresh checkout every
      # file that imports `@/routes` fails to resolve. The type check reported
      # forty "cannot find module" errors that say nothing about the real cause.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, zip, intl
          coverage: none

      - name: Install PHP dependencies
        working-directory: apps/playground
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate the route helpers
        working-directory: apps/playground
        run: |
          cp .env.example .env
          php artisan key:generate
          # `--with-form` MATCHES `formVariants: true` IN vite.config.ts. Without
          # it the route helpers are generated but their `.form` variants are
          # not, and the type check fails on five components that use them - a
          # smaller and more confusing version of the same failure.
          php artisan wayfinder:generate --with-form

      # THE PACKAGES FIRST, AND NOT ONLY FOR SPEED. Both are linked into the
      # application with `file:`, and both carry their own dependencies - the
      # type checker resolves `vue` from the package's real path, so a package
      # with no `node_modules` fails to type-check every file in it while the
      # application itself looks fine.
      - name: Install @panelkit/ui
        working-directory: packages/ui
        run: npm install --no-audit --no-fund

      - name: Install @panelkit/inertia
        working-directory: packages/inertia
        run: npm install --no-audit --no-fund

      - name: Install the application
        working-directory: apps/playground
        run: npm install --no-audit --no-fund

      - name: Unit tests
        working-directory: packages/ui
        run: npm test

      - name: Types
        working-directory: apps/playground
        run: npx vue-tsc --noEmit

      # NO LINT STEP, AND THAT IS A DECISION RATHER THAN AN OVERSIGHT.
      #
      # `npm run lint:check` currently reports 230 violations, because the rule
      # set was added and never enforced. A red build on the first run is a build
      # people learn to ignore, and clearing 230 findings means either a
      # 65-file automated reformat - which buries every real change under
      # semicolons for a year of `git blame` - or a deliberate pass nobody has
      # asked for yet. Neither belongs in the commit that adds CI.
      #
      # The checks below are the ones that catch failures rather than style. Add
      # the lint step in the change that makes it pass.

      # THE BUILD IS NOT REDUNDANT WITH THE TYPE CHECK. A production build
      # resolves every import for real and runs the SFC compiler over every
      # component; the type checker does neither. An import of a file that does
      # not exist type-checks clean and fails here.
      #
      # `build:ssr` RATHER THAN `build`, because it builds both bundles. The
      # server bundle resolves imports through Node rather than the browser
      # field, which is where a duplicated dependency surfaces - the packaged
      # screens once resolved their own copy of `@inertiajs/vue3` and rendered
      # fine in the browser while server rendering died on an internal.
      - name: Build
        working-directory: apps/playground
        run: npm run build:ssr

  # ---------------------------------------------------------------- browser
  #
  # THE ONLY JOB THAT LOADS A PAGE.
  #
  # Two bugs shipped in one afternoon that the other two jobs could not see: a
  # form bound an event the component does not emit - type-checked, built,
  # flipped the radio in the DOM and never told the form - and an invoice
  # rendered three correct figures as one number, because right-aligned cells
  # had no horizontal padding. Both were obvious on a screen and invisible to
  # 1,237 passing tests and a clean type check.
  #
  # A SEPARATE JOB, not a step in the PHP one, because it needs a browser, a
  # built bundle and a running server. Bolting that onto the fast job would
  # make every PHP failure wait for Chrome.
  browser:
    name: Browser tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, zip, intl, bcmath, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PHP dependencies
        working-directory: apps/playground
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        working-directory: apps/playground
        run: |
          cp .env.example .env
          php artisan key:generate

      # Wayfinder writes the route helpers the client imports. They are
      # generated rather than committed, so the build fails without this.
      - name: Generate the route helpers
        working-directory: apps/playground
        run: php artisan wayfinder:generate --with-form

      - name: Install the client half
        run: |
          cd packages/ui && npm install --no-audit --no-fund
          cd ../inertia && npm install --no-audit --no-fund
          cd ../../apps/playground && npm install --no-audit --no-fund

      # CHROME FOR TESTING, at the major version Dusk's ChromeDriver matches.
      # The runner's own Chrome would work today and drift the moment either
      # side updates; pinning the pair is what stops a version mismatch being
      # reported as a browser that will not start.
      - name: Install Chrome
        working-directory: apps/playground
        run: npx --yes @puppeteer/browsers install chrome@151

      - name: Install ChromeDriver
        working-directory: apps/playground
        run: php artisan dusk:chrome-driver --detect

      # The script owns the database, the port and the build. It refuses to run
      # against the development database, which matters less in CI than on a
      # laptop but is the same script either way.
      - name: Browser tests
        run: scripts/dusk.sh

      # THE SCREENSHOTS ARE THE POINT OF UPLOADING ANYTHING. A browser failure
      # in CI is otherwise a selector name and a timeout; the screenshot Dusk
      # takes at the moment of failure is usually the whole diagnosis. The two
      # times this suite failed while being written, the screenshot showed the
      # feature working and the assertion wrong.
      - name: Failure screenshots and console logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-failures
          path: |
            apps/playground/tests/Browser/screenshots
            apps/playground/tests/Browser/console
          retention-days: 7
